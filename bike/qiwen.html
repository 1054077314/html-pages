<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1e3a5f, #0b1020 75%);
    font-family: system-ui, sans-serif;
  }
  .stage {
    width: min(96vw, 1100px);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
  }
  svg { display: block; width: 100%; height: auto; }
  .road-dash {
    stroke-dasharray: 60 45;
    animation: roll 0.45s linear infinite;
  }
  @keyframes roll {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: 105; }
  }
  .caption {
    position: fixed;
    bottom: 14px;
    width: 100%;
    text-align: center;
    color: #7da2c4;
    letter-spacing: .3em;
    font-size: 13px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset=".55" stop-color="#cfeaf9"/>
      <stop offset="1" stop-color="#fdeeda"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc79a"/>
      <stop offset="1" stop-color="#6faf83"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cae5c"/>
      <stop offset="1" stop-color="#4e9146"/>
    </linearGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f8fafc"/>
      <rect width="12" height="12" fill="#1f2937"/>
      <rect x="12" y="12" width="12" height="12" fill="#1f2937"/>
    </pattern>

    <g id="cloud">
      <ellipse cx="0"  cy="0"  rx="34" ry="17" fill="#ffffff"/>
      <ellipse cx="28" cy="6"  rx="26" ry="13" fill="#ffffff"/>
      <ellipse cx="-27" cy="7" rx="24" ry="12" fill="#ffffff"/>
    </g>

    <g id="wheel">
      <circle r="72" fill="none" stroke="#1f2937" stroke-width="9"/>
      <circle r="63" fill="none" stroke="#94a3b8" stroke-width="3"/>
      <g stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round">
        <line x1="-60" y1="0" x2="60" y2="0"/>
        <line x1="0" y1="-60" x2="0" y2="60"/>
        <line x1="-42" y1="-42" x2="42" y2="42"/>
        <line x1="-42" y1="42" x2="42" y2="-42"/>
      </g>
      <circle r="9" fill="#334155"/>
      <circle r="4" fill="#e2e8f0"/>
    </g>

    <g id="hillBump">
      <path d="M0,470 Q120,380 260,448 Q380,492 480,470 Z" fill="url(#hillFar)"/>
      <path d="M420,470 Q580,392 720,452 Q840,494 960,470 Z" fill="url(#hillFar)"/>
    </g>

    <g id="tree">
      <rect x="-4" y="-34" width="8" height="40" fill="#7c5a3a"/>
      <circle cx="0" cy="-46" r="24" fill="#3f8a4e"/>
      <circle cx="-14" cy="-34" r="16" fill="#4a9a58"/>
      <circle cx="15" cy="-36" r="15" fill="#379a52"/>
    </g>

    <g id="poleUnit">
      <use href="#tree" x="80" y="472"/>
      <g stroke="#8b6a44" stroke-width="7" fill="none">
        <line x1="330" y1="472" x2="330" y2="330"/>
        <line x1="312" y1="338" x2="348" y2="338"/>
      </g>
      <use href="#tree" x="620" y="472"/>
      <g stroke="#8b6a44" stroke-width="7" fill="none">
        <line x1="860" y1="472" x2="860" y2="346"/>
        <line x1="844" y1="354" x2="876" y2="354"/>
      </g>
    </g>
  </defs>

  <!-- sky -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <circle cx="128" cy="96" r="46" fill="#ffd84d">
    <animate attributeName="r" values="46;49;46" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="128" cy="96" r="60" fill="#ffd84d" opacity=".25"/>

  <!-- clouds -->
  <g opacity=".9">
    <use href="#cloud" x="180" y="110">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="40s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" x="560" y="80" transform="scale(1.2)">
      <animateTransform attributeName="transform" type="translate" additive="sum" from="0 0" to="-1020 0" dur="55s" repeatCount="indefinite"/>
    </use>
    <use href="#cloud" x="850" y="150">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1040 0" dur="47s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- far hills, parallax scroll -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="16s" repeatCount="indefinite"/>
    <use href="#hillBump"/>
    <use href="#hillBump" x="960"/>
  </g>

  <!-- near ground with trees / poles -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="7s" repeatCount="indefinite"/>
    <path d="M0,478 Q240,452 480,476 Q720,498 960,472 Q1200,452 1440,476 Q1680,498 1920,472 L1920,540 L0,540 Z" fill="url(#hillNear)"/>
    <use href="#poleUnit"/>
    <use href="#poleUnit" x="960"/>
  </g>

  <!-- road -->
  <rect y="466" width="960" height="74" fill="#4b5563"/>
  <rect y="466" width="960" height="6" fill="#374151"/>
  <line x1="0" y1="506" x2="960" y2="506" stroke="#e5e7eb" stroke-width="7" class="road-dash"/>

  <!-- ground shadow -->
  <ellipse cx="452" cy="497" rx="185" ry="14" fill="#000000" opacity=".22"/>

  <!-- ================= BIRD ON A BICYCLE ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 2 1.5; 0 0; -2 1.5; 0 0" dur="1.2s" repeatCount="indefinite"/>

    <!-- wheels -->
    <g transform="translate(340 415)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>
    <g transform="translate(548 415)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
        <use href="#wheel"/>
      </g>
    </g>

    <!-- frame -->
    <g stroke="#d64545" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="340" y1="415" x2="430" y2="380"/>
      <line x1="340" y1="415" x2="395" y2="300"/>
      <line x1="430" y1="380" x2="395" y2="300"/>
      <line x1="430" y1="380" x2="516" y2="332"/>
      <line x1="395" y1="300" x2="516" y2="322"/>
      <line x1="512" y1="310" x2="522" y2="348" stroke-width="12"/>
      <line x1="522" y1="346" x2="548" y2="415"/>
      <line x1="382" y1="300" x2="395" y2="300" stroke-width="12"/>
    </g>
    <!-- handlebar + saddle -->
    <path d="M514,308 Q505,292 488,296" stroke="#334155" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M366,296 Q382,286 400,294 L396,302 Q381,296 370,303 Z" fill="#1f2937"/>

    <!-- chain + cogs -->
    <g stroke="#6b7280" stroke-width="3.5" fill="none">
      <line x1="330" y1="403" x2="414" y2="366"/>
      <line x1="332" y1="428" x2="416" y2="395"/>
      <circle cx="340" cy="415" r="13" stroke-width="5"/>
    </g>

    <!-- far crank + pedal -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="180 430 380" to="540 430 380" dur="1.2s" repeatCount="indefinite"/>
      <line x1="430" y1="380" x2="456" y2="380" stroke="#1f2937" stroke-width="7" stroke-linecap="round"/>
      <rect x="447" y="377" width="19" height="6" rx="2" fill="#0f172a"/>
    </g>
    <circle cx="430" cy="380" r="19" fill="none" stroke="#475569" stroke-width="4"/>
    <circle cx="430" cy="380" r="6" fill="#334155"/>

    <!-- far leg -->
    <path stroke="#e2725b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="d" calcMode="linear" dur="1.2s" repeatCount="indefinite"
        values="M365,300 L433.2,316.2 L404,380;
                M365,300 L434.8,295.6 L411.6,361.6;
                M365,300 L433.1,284.1 L430,354;
                M365,300 L444.2,293.0 L448.4,361.6;
                M365,300 L433.7,313.6 L456,380;
                M365,300 L427.5,331.6 L448.4,398.4;
                M365,300 L425.2,336.0 L430,406;
                M365,300 L428.2,330.3 L411.6,398.4;
                M365,300 L433.2,316.2 L404,380"/>
    </path>

    <!-- ================= PELICAN ================= -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 2.5; 0 0; 0 -2; 0 0" dur="0.6s" repeatCount="indefinite"/>

      <!-- tail -->
      <path d="M312,238 Q262,214 236,224 Q268,240 258,262 Q290,262 316,255 Z" fill="#e5e7eb" stroke="#c3c9d2" stroke-width="2"/>

      <!-- wing (behind body) -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="4 408 236; -24 408 236; 6 408 236; 4 408 236" dur="0.6s" repeatCount="indefinite"/>
        <path d="M415,238 Q360,196 300,214 Q346,232 336,262 Q384,268 420,256 Z" fill="#f1f5f9" stroke="#c3c9d2" stroke-width="2.5"/>
      </g>

      <!-- body -->
      <ellipse cx="392" cy="256" rx="86" ry="52" transform="rotate(-9 392 256)" fill="#ffffff" stroke="#d4d9e0" stroke-width="3"/>
      <path d="M330,286 Q392,318 456,282" fill="none" stroke="#d4d9e0" stroke-width="2.5"/>

      <!-- neck -->
      <path d="M452,236 Q486,210 478,172 Q474,152 490,146" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>

      <!-- head -->
      <circle cx="492" cy="146" r="24" fill="#ffffff" stroke="#d4d9e0" stroke-width="3"/>

      <!-- upper beak -->
      <path d="M510,136 L618,156 Q622,161 614,164 L508,156 Z" fill="#f5a324" stroke="#d98a12" stroke-width="2"/>
      <!-- pouch (wobbles) -->
      <path fill="#fbc96a" stroke="#d98a12" stroke-width="2">
        <animate attributeName="d" calcMode="spline" dur="1.2s" repeatCount="indefinite"
          keyTimes="0;.5;1" keySplines=".4 0 .6 1;.4 0 .6 1"
          values="M508,156 L612,162 Q574,214 512,180 Q502,168 508,156 Z;
                  M508,156 L612,162 Q570,232 510,188 Q500,170 508,156 Z;
                  M508,156 L612,162 Q574,214 512,180 Q502,168 508,156 Z"/>
      </path>

      <!-- eye + brows -->
      <circle cx="500" cy="140" r="5" fill="#1f2937"/>
      <circle cx="501.6" cy="138.4" r="1.7" fill="#ffffff"/>
      <path d="M493,131 Q500,127 508,131" stroke="#9aa4b0" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- cycling cap -->
      <path d="M470,131 Q474,108 496,108 Q514,110 514,128 L470,131 Z" fill="#ef4444"/>
      <path d="M512,128 Q530,124 534,132 Q522,136 512,133 Z" fill="#c93030"/>
      <circle cx="492" cy="108" r="4" fill="#c93030"/>

      <!-- near wing holding handlebar -->
      <path d="M428,252 Q466,262 490,292" fill="none" stroke="#e5e7eb" stroke-width="14" stroke-linecap="round"/>
      <path d="M490,292 Q494,300 486,304" fill="none" stroke="#f5a324" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- near crank + pedal -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 430 380" to="360 430 380" dur="1.2s" repeatCount="indefinite"/>
      <line x1="430" y1="380" x2="456" y2="380" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
      <rect x="447" y="376.5" width="19" height="7" rx="2.5" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    </g>

    <!-- near leg -->
    <path stroke="#f08a6f" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <animate attributeName="d" calcMode="linear" dur="1.2s" repeatCount="indefinite"
        values="M365,300 L433.7,313.6 L456,380;
                M365,300 L427.5,331.6 L448.4,398.4;
                M365,300 L425.2,336.0 L430,406;
                M365,300 L428.2,330.3 L411.6,398.4;
                M365,300 L433.2,316.2 L404,380;
                M365,300 L434.8,295.6 L411.6,361.6;
                M365,300 L433.1,284.1 L430,354;
                M365,300 L444.2,293.0 L448.4,361.6;
                M365,300 L433.7,313.6 L456,380"/>
    </path>

    <!-- checkered flag at the back -->
    <g>
      <line x1="352" y1="300" x2="330" y2="176" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(330 176)">
        <g>
          <animateTransform attributeName="transform" type="skewY" values="0;-7;0;7;0" dur="0.9s" repeatCount="indefinite"/>
          <rect x="-64" y="-2" width="64" height="42" fill="url(#checker)" stroke="#1f2937" stroke-width="1.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- speed lines -->
  <g stroke="#64748b" stroke-width="4" stroke-linecap="round" opacity=".55">
    <line x1="212" y1="250" x2="150" y2="250">
      <animate attributeName="opacity" values="0;.6;0" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="240;120" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="190;60" dur="0.7s" repeatCount="indefinite"/>
    </line>
    <line x1="230" y1="322" x2="180" y2="322">
      <animate attributeName="opacity" values="0;.5;0" dur="0.9s" begin="-.4s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="256;140" dur="0.9s" begin="-.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="208;84" dur="0.9s" begin="-.4s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="180" x2="210" y2="180">
      <animate attributeName="opacity" values="0;.45;0" dur="1.1s" begin="-.7s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="262;150" dur="1.1s" begin="-.7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="224;102" dur="1.1s" begin="-.7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- caption in scene -->
  <text x="480" y="64" text-anchor="middle" font-size="30" font-weight="700" fill="#1f4e79"
        font-family="'Segoe UI', system-ui, sans-serif" letter-spacing="2" opacity=".85">
    Bird on a bicycle!
    <animate attributeName="opacity" values=".85;.55;.85" dur="2.4s" repeatCount="indefinite"/>
  </text>
</svg>
</div>
<div class="caption">鹈鹕骑自行车 · Pure SVG + SMIL</div>
</body>
</html>
