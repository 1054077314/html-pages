<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  svg{display:block;width:100vw;height:100vh}
  #ui{position:fixed;left:12px;bottom:12px;color:#fff;font:14px sans-serif;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:8px}
  #ui input{vertical-align:middle}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a5a"/><stop offset=".45" stop-color="#ffd59a"/><stop offset="1" stop-color="#bfe8ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa7d6"/><stop offset="1" stop-color="#1d6fa3"/>
    </linearGradient>
    <radialGradient id="sunG"><stop offset="0" stop-color="#fff6b0"/><stop offset=".6" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe3e8"/></linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9f1c"/><stop offset="1" stop-color="#ffc857"/></linearGradient>
    <g id="palm">
      <path d="M0 0 q-8 -90 10 -180" stroke="#7a4e2d" stroke-width="12" fill="none" stroke-linecap="round"/>
      <g fill="#2f8f46" transform="translate(10,-180)">
        <path d="M0 0 q-50 -30 -90 10 q45 -10 90 -10z"/><path d="M0 0 q50 -30 90 10 q-45 -10 -90 -10z"/>
        <path d="M0 0 q-30 -50 -10 -80 q0 40 10 80z"/><path d="M0 0 q40 -45 70 -40 q-40 15 -70 40z"/>
        <path d="M0 0 q-45 10 -70 50 q30 -35 70 -50z"/>
      </g>
    </g>
    <g id="cloud" fill="#fff" opacity=".9">
      <ellipse cx="0" cy="0" rx="60" ry="20"/><ellipse cx="30" cy="-14" rx="38" ry="24"/><ellipse cx="-28" cy="-8" rx="28" ry="18"/>
    </g>
    <g id="gull"><path d="M-14 0 q7 -8 14 0 q7 -8 14 0" stroke="#333" stroke-width="2.5" fill="none"/></g>
  </defs>

  <rect width="1200" height="700" fill="url(#sky)"/>
  <circle cx="950" cy="250" r="120" fill="url(#sunG)"/>
  <g id="clouds"></g>
  <g id="gulls"></g>
  <rect y="380" width="1200" height="140" fill="url(#sea)"/>
  <g id="waves" stroke="#bfe6ff" stroke-width="3" fill="none" opacity=".7"></g>
  <g id="hills"></g>
  <rect y="510" width="1200" height="190" fill="#f2d49b"/>
  <g id="palms"></g>
  <rect y="590" width="1200" height="70" fill="#4a4a4a"/>
  <line id="dash" x1="-100" y1="625" x2="1300" y2="625" stroke="#fff" stroke-width="5" stroke-dasharray="50 40"/>

  <!-- shadow -->
  <ellipse id="shadow" cx="600" cy="600" rx="230" ry="12" fill="#000" opacity=".25"/>

  <g id="rig">
    <!-- far leg -->
    <path id="legB" stroke="#e8890c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="footB" fill="#e8890c"/>
    <!-- bike -->
    <g id="wheelR"></g><g id="wheelF"></g>
    <g stroke="#e63946" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="440,520 600,510 565,395 440,520"/>
      <polyline points="600,510 735,405 565,395"/>
      <line x1="735" y1="405" x2="780" y2="520"/>
      <line x1="735" y1="405" x2="722" y2="365"/>
      <line x1="565" y1="395" x2="556" y2="368"/>
    </g>
    <path d="M700 365 q25 -14 52 0 l10 18" stroke="#222" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M520 362 q40 -8 70 2 q-30 10 -70 -2z" fill="#222"/>
    <circle cx="600" cy="510" r="20" fill="#999" stroke="#555" stroke-width="3"/>
    <g id="crank"></g>
    <!-- pelican -->
    <g id="bird">
      <path id="tail" d="M480 330 L430 330 L482 352 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
      <ellipse cx="560" cy="320" rx="95" ry="62" fill="url(#body)" stroke="#adb5bd" stroke-width="3"/>
      <path id="wing" d="M500 300 q60 -40 120 5 q-50 45 -130 20z" fill="#ced4da" stroke="#868e96" stroke-width="3"/>
      <path id="arm" stroke="#ced4da" stroke-width="18" fill="none" stroke-linecap="round"/>
      <g id="headG">
        <path d="M620 290 q35 -70 22 -130" stroke="#fff" stroke-width="40" fill="none" stroke-linecap="round"/>
        <path d="M620 290 q35 -70 22 -130" stroke="#e9ecef" stroke-width="6" fill="none" stroke-dasharray="4 14" stroke-linecap="round"/>
        <circle cx="645" cy="150" r="36" fill="#fff" stroke="#adb5bd" stroke-width="3"/>
        <path d="M628 118 q12 -32 38 -18 M636 116 q20 -28 42 -6" stroke="#ffd166" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- goggles -->
        <path d="M612 140 h70" stroke="#264653" stroke-width="6"/>
        <circle cx="656" cy="142" r="14" fill="#a8dadc" stroke="#264653" stroke-width="5"/>
        <g id="eye"><circle cx="658" cy="142" r="6" fill="#111"/><circle cx="660" cy="139" r="2" fill="#fff"/></g>
        <rect id="lid" x="642" y="128" width="28" height="0" fill="#fff"/>
        <g id="beakG">
          <path d="M672 150 L850 178 L676 168 Z" fill="url(#beak)" stroke="#c96f00" stroke-width="2"/>
          <path d="M850 178 l8 6 l-12 -2z" fill="#c96f00"/>
          <g id="lower"><path id="pouch" fill="#ffd28a" stroke="#c96f00" stroke-width="2"/></g>
        </g>
      </g>
      <path id="scarf1" d="M600 240 q35 14 60 -6" stroke="#457b9d" stroke-width="16" fill="none" stroke-linecap="round"/>
      <path id="scarf2" stroke="#457b9d" stroke-width="12" fill="none" stroke-linecap="round"/>
    </g>
    <!-- near leg -->
    <path id="legA" stroke="#ff9f1c" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="footA" fill="#ff9f1c"/>
  </g>
  <g id="fx"></g>
  <text x="600" y="60" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#fff" stroke="#c0392b" stroke-width="1.5">鹈鹕骑自行车</text>
</svg>
<div id="ui">速度 <input id="spd" type="range" min="0" max="3" step="0.05" value="1"> · 点击画面按铃铛</div>
<script>
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};

// wheels
function wheel(g,cx,cy){const r=78;el("circle",{cx,cy,r,fill:"none",stroke:"#1b1b1b","stroke-width":13},g);
  el("circle",{cx,cy,r:r-8,fill:"none",stroke:"#adb5bd","stroke-width":3},g);
  const sp=el("g",{},g);for(let i=0;i<16;i++){const a=i*Math.PI/8;el("line",{x1:cx,y1:cy,x2:cx+Math.cos(a)*(r-8),y2:cy+Math.sin(a)*(r-8),stroke:"#ced4da","stroke-width":1.6},sp)}
  el("circle",{cx,cy,r:9,fill:"#666"},g);return sp}
const spR=wheel($("wheelR"),440,520),spF=wheel($("wheelF"),780,520);
const crank=$("crank");

// scenery
const W=1200,layers=[];
function layer(g,make,n,gap,speed){const items=[];for(let i=0;i<n;i++){const e=make(i);g.appendChild(e);items.push({e,x:i*gap+Math.random()*gap*.5})}layers.push({items,speed,span:n*gap})}
const use=(h,y,s)=>{const u=el("use",{href:"#"+h});u.dataset.y=y;u.dataset.s=s;return u};
layer($("clouds"),i=>use("cloud",80+Math.random()*120,.6+Math.random()*.8),5,320,.08);
layer($("gulls"),i=>use("gull",120+Math.random()*120,.8+Math.random()*.6),4,380,.25);
layer($("palms"),i=>use("palm",575,.7+Math.random()*.5),4,420,1.6);
const hills=$("hills");
for(let i=0;i<2;i++){el("path",{d:"M0 520 Q150 440 300 500 T600 490 T900 470 T1200 520 Z",fill:"#e3c07f",transform:`translate(${i*1200},0)`},hills)}
const waves=$("waves");for(let i=0;i<14;i++){el("path",{d:`M${i*180} ${410+(i%4)*25} q20 -8 40 0 q20 8 40 0`},waves)}

// IK leg
const HIP=[560,350],L1=105,L2=100,CR=[600,510],CL=42;
function leg(path,foot,ang){
  const fx=CR[0]+Math.cos(ang)*CL,fy=CR[1]+Math.sin(ang)*CL;
  const dx=fx-HIP[0],dy=fy-HIP[1],d=Math.min(Math.hypot(dx,dy),L1+L2-1);
  const a=Math.atan2(dy,dx),o=Math.acos((L1*L1+d*d-L2*L2)/(2*L1*d));
  const kx=HIP[0]+Math.cos(a-o)*L1,ky=HIP[1]+Math.sin(a-o)*L1;
  path.setAttribute("d",`M${HIP[0]} ${HIP[1]} L${kx} ${ky} L${fx} ${fy}`);
  foot.setAttribute("d",`M${fx-8} ${fy} l34 -4 l-6 8 l8 4 l-30 4 z`);
  return [fx,fy]}

// bell + fx
let bell=0;const fx=$("fx");
document.body.addEventListener("click",()=>{bell=1;
  const t=el("text",{x:770,y:330,"font-size":34,"font-family":"sans-serif",fill:"#ffd166",stroke:"#7a4e00","stroke-width":1},fx);t.textContent="叮叮~ 🔔";
  let k=0;(function f(){k++;t.setAttribute("y",330-k*1.2);t.setAttribute("opacity",1-k/60);k<60?requestAnimationFrame(f):t.remove()})()});

let t0=performance.now(),phase=0,dist=0,blinkT=0;
function frame(now){
  const dt=Math.min(50,now-t0)/1000;t0=now;const v=+$("spd").value;
  phase+=dt*v*5;dist+=dt*v*260;const t=now/1000;

  // scenery scroll
  for(const L of layers)for(const it of L.items){let x=((it.x-dist*L.speed)%L.span+L.span)%L.span-150;
    it.e.setAttribute("transform",`translate(${x},${it.e.dataset.y}) scale(${it.e.dataset.s})`)}
  hills.setAttribute("transform",`translate(${-(dist*.4)%1200},0)`);
  waves.setAttribute("transform",`translate(${-(dist*.15)%180+Math.sin(t)*6},0)`);
  $("dash").setAttribute("stroke-dashoffset",dist*1.9);

  // wheels & crank
  const wr=dist*1.9/78*180/Math.PI;
  spR.setAttribute("transform",`rotate(${wr} 440 520)`);spF.setAttribute("transform",`rotate(${wr} 780 520)`);
  const ca=phase;crank.innerHTML="";
  for(const s of [0,Math.PI]){const x=CR[0]+Math.cos(ca+s)*CL,y=CR[1]+Math.sin(ca+s)*CL;
    el("line",{x1:CR[0],y1:CR[1],x2:x,y2:y,stroke:"#444","stroke-width":8,"stroke-linecap":"round"},crank);
    el("rect",{x:x-16,y:y-4,width:32,height:8,rx:3,fill:"#222"},crank)}

  // rig bob
  const bob=Math.sin(phase*2)*3*Math.min(v,1.5);
  $("rig").setAttribute("transform",`translate(0,${bob})`);
  $("shadow").setAttribute("rx",230-bob*2);

  leg($("legA"),$("footA"),ca);leg($("legB"),$("footB"),ca+Math.PI);

  // body sway, head, beak
  $("bird").setAttribute("transform",`rotate(${Math.sin(phase)*1.5} 560 350)`);
  $("headG").setAttribute("transform",`rotate(${Math.sin(t*1.7)*4+bell*-8} 620 290)`);
  const open=4+Math.max(0,Math.sin(t*1.3))*10+bell*22;
  const sag=30+Math.sin(phase*2)*6+v*6;
  $("pouch").setAttribute("d",`M676 168 L850 178 Q${780} ${195+sag+open} 690 ${180+open*.4} Z`);
  $("lower").setAttribute("transform",`rotate(${open*.35} 676 168)`);
  bell=Math.max(0,bell-dt*1.5);

  // wing / arm to handlebar
  $("wing").setAttribute("transform",`rotate(${Math.sin(t*3)*3+bell*-15} 560 305)`);
  $("arm").setAttribute("d",`M610 310 q55 ${10+Math.sin(phase)*4} 100 52`);
  // tail flutter
  $("tail").setAttribute("transform",`rotate(${Math.sin(t*8)*4*v} 482 340)`);
  // scarf
  const w=Math.sin(t*9)*8*v,w2=Math.cos(t*7)*10*v;
  $("scarf2").setAttribute("d",`M605 245 q-50 ${8+w} -95 ${-6+w2} q-30 ${-6-w} -55 ${4+w}`);
  // blink
  blinkT-=dt;if(blinkT<-0.15)blinkT=2+Math.random()*3;
  $("lid").setAttribute("height",blinkT<0?28:0);

  requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
</body>
</html>
