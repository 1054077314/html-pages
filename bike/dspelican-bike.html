<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
<style>
  html,body{height:100%}
  body{
    margin:0;display:grid;place-items:center;
    background:radial-gradient(120% 130% at 50% -10%,#1e2b3c,#080c12 72%);
    font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  .stage{
    width:min(100vw,1180px);
    aspect-ratio:900/520;
    max-height:96vh;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 30px 90px -35px #000,0 0 0 1px #ffffff1a;
  }
  svg{display:block;width:100%;height:100%}

  /* 头部随踏频轻微起伏 */
  #headGrp{animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(-2.5px)}50%{transform:translateY(2.5px)}}

  /* 远侧翅膀扇动 */
  #farWing{transform-box:view-box;transform-origin:400px 158px;animation:flap 1.2s ease-in-out infinite}
  @keyframes flap{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}}

  /* 喉囊里的小鱼 */
  #fish{transform-box:view-box;transform-origin:544px 152px;animation:wiggle .45s ease-in-out infinite}
  @keyframes wiggle{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}

  /* 尾羽抖动 */
  #tail{transform-box:view-box;transform-origin:326px 228px;animation:tailwag 1.2s ease-in-out infinite}
  @keyframes tailwag{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

  /* 背景飞鸟 */
  .farbird{animation:drift 12s linear infinite;transform-box:view-box}
  @keyframes drift{from{transform:translateX(700px)}to{transform:translateX(-1200px)}}

  /* 速度线 */
  .wind{animation:wind 1s linear infinite}
  @keyframes wind{
    0%{transform:translateX(140px);opacity:0}
    12%{opacity:.75}
    75%{opacity:.35}
    100%{transform:translateX(-420px);opacity:0}
  }

  /* 后轮扬尘 */
  .dust{transform-box:view-box;animation:dust 1.1s ease-out infinite}
  @keyframes dust{
    0%{transform:translate(0,0) scale(.25);opacity:.55}
    100%{transform:translate(-190px,-52px) scale(1.7);opacity:0}
  }
  @media (prefers-reduced-motion:reduce){
    #headGrp,#farWing,#fish,#tail,.wind,.dust,.farbird{animation:none}
  }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="一只鹈鹕骑着自行车向前飞驰">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#78c7ef"/>
      <stop offset="52%" stop-color="#bfe6f9"/>
      <stop offset="100%" stop-color="#eefaff"/>
    </linearGradient>
    <radialGradient id="sunG">
      <stop offset="0" stop-color="#fff8cf" stop-opacity=".95"/>
      <stop offset="45%" stop-color="#ffe184" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d646d"/>
      <stop offset="55%" stop-color="#4a5058"/>
      <stop offset="100%" stop-color="#343a41"/>
    </linearGradient>
    <linearGradient id="bodyG" x1=".15" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#f0f5fa"/>
      <stop offset="100%" stop-color="#d2dfec"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2=".5">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#f59b18"/>
    </linearGradient>
    <linearGradient id="pouchG" x1=".2" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#ffe0a0"/>
      <stop offset="100%" stop-color="#f0a032"/>
    </linearGradient>
  </defs>

  <!-- ======== 天空 ======== -->
  <rect width="900" height="520" fill="url(#sky)"/>
  <circle cx="772" cy="92" r="128" fill="url(#sunG)"/>
  <circle cx="772" cy="92" r="40" fill="#fff1ab"/>

  <g id="birds"></g>
  <g id="clouds"></g>

  <!-- ======== 远山 / 近山 / 路边景物 ======== -->
  <g id="hillsFar"></g>
  <g id="hillsNear"></g>
  <g id="scenery"></g>

  <!-- ======== 路面 ======== -->
  <g id="ground">
    <rect x="-10" y="433" width="920" height="100" fill="url(#roadG)"/>
    <rect x="-10" y="430" width="920" height="6" fill="#7d8792"/>
    <rect x="-10" y="436" width="920" height="3" fill="#2b3037" opacity=".5"/>
    <line id="roadDashes" x1="-40" y1="484" x2="940" y2="484"
          stroke="#f4e7b8" stroke-width="7" stroke-dasharray="66 58" stroke-linecap="round" opacity=".85"/>
    <rect x="-10" y="497" width="920" height="23" fill="#2b3037" opacity=".28"/>
  </g>

  <!-- 车影 -->
  <ellipse cx="470" cy="437" rx="262" ry="11" fill="#1b2026" opacity=".22"/>

  <!-- ======== 车轮 ======== -->
  <g id="rearWheel">
    <animateTransform attributeName="transform" type="rotate" from="0 280 355" to="360 280 355" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="280" cy="355" r="78" fill="none" stroke="#262c33" stroke-width="14"/>
    <circle cx="280" cy="355" r="69" fill="none" stroke="#d7e0ea" stroke-width="6"/>
    <g id="rearSpokes"></g>
    <circle cx="280" cy="355" r="10" fill="#8d99a6"/>
  </g>
  <g id="frontWheel">
    <animateTransform attributeName="transform" type="rotate" from="0 660 355" to="360 660 355" dur="1.5s" repeatCount="indefinite"/>
    <circle cx="660" cy="355" r="78" fill="none" stroke="#262c33" stroke-width="14"/>
    <circle cx="660" cy="355" r="69" fill="none" stroke="#d7e0ea" stroke-width="6"/>
    <g id="frontSpokes"></g>
    <circle cx="660" cy="355" r="10" fill="#8d99a6"/>
  </g>

  <!-- ======== 远侧曲柄 + 远侧腿（在车架后面） ======== -->
  <g id="farSide">
    <line id="farCrank" x1="478" y1="368" x2="452" y2="368" stroke="#3a424c" stroke-width="11" stroke-linecap="round"/>
    <g id="farPedalG"><rect x="-13" y="-3.5" width="26" height="7" rx="2.5" fill="#2b3138"/></g>
    <path id="farLeg" fill="none" stroke="#e8952f" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="farFootG"><path d="M -7,-5 C 2,-9 15,-8 25,-4 C 30,-2 30,2 25,4 C 15,8 2,9 -7,5 C -10,3 -10,-3 -7,-5 Z" fill="#e8952f"/></g>
  </g>

  <!-- ======== 车架 ======== -->
  <g id="frame" fill="none" stroke="#e2574c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M478,368 L280,355"/>
    <path d="M415,262 L280,355"/>
    <path d="M478,368 L415,262"/>
    <path d="M478,368 L620,308"/>
    <path d="M415,262 L640,269"/>
    <path d="M638,266 L620,306"/>
    <path d="M620,306 C 636,326 650,344 660,355"/>
  </g>
  <g fill="none" stroke="#8d99a6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M415,262 L406,240"/>
    <path d="M640,269 L650,244"/>
    <path d="M618,244 L684,244"/>
  </g>
  <circle cx="624" cy="244" r="6" fill="#2b3138"/>
  <circle cx="678" cy="244" r="6" fill="#2b3138"/>
  <!-- 车座 -->
  <path d="M372,240 C 370,229 390,223 414,227 C 432,230 442,237 437,244 C 430,252 400,252 386,248 C 378,246 373,244 372,240 Z"
        fill="#2f3640"/>
  <!-- 链条 + 牙盘 -->
  <circle cx="280" cy="355" r="14" fill="none" stroke="#9aa5b1" stroke-width="6"/>
  <g id="chainring">
    <animateTransform attributeName="transform" type="rotate" from="0 478 368" to="360 478 368" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="478" cy="368" r="31" fill="none" stroke="#c6cfda" stroke-width="8"/>
    <circle cx="478" cy="368" r="31" fill="none" stroke="#5c6570" stroke-width="8" stroke-dasharray="4 5"/>
    <circle cx="478" cy="368" r="22" fill="none" stroke="#9aa5b1" stroke-width="4"/>
  </g>
  <g stroke="#7d8792" stroke-width="4" fill="none">
    <line x1="473.5" y1="338.3" x2="278" y2="342.1" stroke-dasharray="7 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-26" dur=".32s" repeatCount="indefinite"/>
    </line>
    <line x1="477.4" y1="398" x2="279.7" y2="368"/>
  </g>

  <!-- ======== 鹈鹕 ======== -->
  <g id="pelican">
    <!-- 尾羽 -->
    <g id="tail" fill="none" stroke-linecap="round">
      <path d="M 328,226 C 306,224 286,214 274,198" stroke="#a8bacd" stroke-width="18"/>
      <path d="M 328,226 C 306,224 286,214 274,198" stroke="#dbe6f1" stroke-width="13"/>
      <path d="M 326,234 C 302,236 282,232 268,222" stroke="#a8bacd" stroke-width="18"/>
      <path d="M 326,234 C 302,236 282,232 268,222" stroke="#dbe6f1" stroke-width="13"/>
      <path d="M 322,242 C 300,246 282,248 268,244" stroke="#a8bacd" stroke-width="18"/>
      <path d="M 322,242 C 300,246 282,248 268,244" stroke="#dbe6f1" stroke-width="13"/>
    </g>

    <!-- 远侧翅膀（扇动） -->
    <g id="farWing" fill="none" stroke-linecap="round">
      <path d="M 398,152 C 380,126 358,106 330,94" stroke="#9cb1c7" stroke-width="19"/>
      <path d="M 398,152 C 380,126 358,106 330,94" stroke="#cfdeed" stroke-width="14"/>
      <path d="M 398,160 C 384,138 366,120 342,108" stroke="#9cb1c7" stroke-width="19"/>
      <path d="M 398,160 C 384,138 366,120 342,108" stroke="#cfdeed" stroke-width="14"/>
      <path d="M 398,168 C 388,150 374,134 354,124" stroke="#9cb1c7" stroke-width="19"/>
      <path d="M 398,168 C 388,150 374,134 354,124" stroke="#cfdeed" stroke-width="14"/>
    </g>

    <!-- 脖颈 -->
    <path d="M 408,154 C 420,116 442,90 468,72 L 498,104 C 474,118 458,142 452,172 Z"
          fill="url(#bodyG)" stroke="#c6d4e3" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 身体 -->
    <path d="M 306,178 C 316,146 356,130 398,134 C 434,138 456,164 458,196
             C 460,228 440,250 404,256 C 364,262 322,248 308,218 C 302,204 302,190 306,178 Z"
          fill="url(#bodyG)" stroke="#c6d4e3" stroke-width="2.5"/>
    <path d="M 330,168 C 352,150 388,144 414,152" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity=".8"/>

    <!-- 头 + 喙 + 头盔 -->
    <g id="headGrp">
      <circle cx="486" cy="74" r="32" fill="url(#bodyG)" stroke="#c6d4e3" stroke-width="2.5"/>

      <!-- 囊里的鱼（后画喉囊，只露出鱼尾） -->
      <g id="fish">
        <path d="M 534,150 L 528,190 L 546,176 L 564,192 L 552,148 Z"
              fill="#8ed0e6" stroke="#4fa8c4" stroke-width="2.4" stroke-linejoin="round"/>
      </g>

      <!-- 喉囊 -->
      <path d="M 496,88 C 542,92 580,94 608,98 C 604,130 574,156 534,156 C 498,156 482,120 496,88 Z"
            fill="url(#pouchG)" stroke="#dd8b1c" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 508,108 C 526,134 552,148 582,142" fill="none" stroke="#dd8b1c" stroke-width="2" opacity=".4" stroke-linecap="round"/>

      <!-- 上喙 -->
      <path d="M 498,60 C 544,66 588,78 612,92 C 615,99 608,103 600,100 C 562,90 522,82 490,80 Z"
            fill="url(#beakG)" stroke="#d9820f" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 502,74 C 546,80 586,90 608,99" fill="none" stroke="#f6c664" stroke-width="2.5" opacity=".7" stroke-linecap="round"/>
      <circle cx="603" cy="94" r="3" fill="#8a4d06"/>
      <!-- 眼睛 -->
      <circle cx="472" cy="70" r="7" fill="#28303a"/>
      <circle cx="474.5" cy="67.5" r="2.4" fill="#fff"/>
      <!-- 头盔 -->
      <path d="M 458,62 C 457,24 515,24 514,62 C 502,44 470,44 458,62 Z"
            fill="#e2574c" stroke="#b93f36" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 508,50 L 548,57 L 550,66 L 510,61 Z" fill="#2f3640" stroke="#20262d" stroke-width="2"/>
      <path d="M 478,36 L 494,36 M 482,28 L 490,28" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    </g>

    <!-- 近侧翅膀：收拢贴在身侧 -->
    <g id="nearWing" fill="none" stroke-linecap="round">
      <path d="M 404,168 C 374,166 344,178 318,200" stroke="#c6d4e3" stroke-width="28"/>
      <path d="M 404,168 C 374,166 344,178 318,200" stroke="#eef4fa" stroke-width="23"/>
      <path d="M 406,180 C 380,180 354,190 332,210" stroke="#c6d4e3" stroke-width="25"/>
      <path d="M 406,180 C 380,180 354,190 332,210" stroke="#e2eaf4" stroke-width="20"/>
      <path d="M 406,192 C 384,194 362,202 344,220" stroke="#c6d4e3" stroke-width="21"/>
      <path d="M 406,192 C 384,194 362,202 344,220" stroke="#d6e2ef" stroke-width="16"/>
    </g>
  </g>

  <!-- ======== 近侧曲柄 + 近侧腿（在车架与身体之前） ======== -->
  <g id="nearSide">
    <line id="nearCrank" x1="478" y1="368" x2="504" y2="368" stroke="#4a545f" stroke-width="11" stroke-linecap="round"/>
    <g id="nearPedalG"><rect x="-13" y="-3.5" width="26" height="7" rx="2.5" fill="#2b3138"/></g>
    <path id="nearLeg" fill="none" stroke="#f0a24a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="nearFootG">
      <path d="M -7,-5 C 2,-9 15,-8 25,-4 C 30,-2 30,2 25,4 C 15,8 2,9 -7,5 C -10,3 -10,-3 -7,-5 Z"
            fill="#f0a24a" stroke="#d4832c" stroke-width="2"/>
      <path d="M 6,-6 L 10,6 M 16,-7 L 20,7" stroke="#d4832c" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ======== 前景特效 ======== -->
  <g id="fx" fill="none" stroke="#ffffff" stroke-linecap="round">
    <line class="wind" x1="180" y1="150" x2="250" y2="150" stroke-width="5" opacity="0" style="animation-delay:0s"/>
    <line class="wind" x1="160" y1="214" x2="214" y2="214" stroke-width="4" opacity="0" style="animation-delay:.28s"/>
    <line class="wind" x1="200" y1="292" x2="286" y2="292" stroke-width="6" opacity="0" style="animation-delay:.55s"/>
    <line class="wind" x1="150" y1="342" x2="206" y2="342" stroke-width="4" opacity="0" style="animation-delay:.8s"/>
  </g>
  <g id="dust" fill="#cfd8e3">
    <circle class="dust" cx="238" cy="420" r="11" style="animation-delay:0s"/>
    <circle class="dust" cx="228" cy="426" r="8" style="animation-delay:.35s"/>
    <circle class="dust" cx="248" cy="414" r="9" style="animation-delay:.7s"/>
  </g>
</svg>
</div>

<script>
(function(){
  "use strict";
  const NS = "http://www.w3.org/2000/svg";
  const svgEl = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const $ = id => document.getElementById(id);

  /* ---------- 运动参数 ---------- */
  const WHEEL_R = 78;
  const WHEEL_PERIOD = 1.5;                      // 车轮一圈耗时(s)
  const SPEED = WHEEL_R * 2 * Math.PI / WHEEL_PERIOD;  // 地面行进速度 px/s
  const CRANK_W = 2 * Math.PI / 1.2;             // 曲柄角速度 rad/s

  /* ---------- 骨骼/几何 ---------- */
  const BB   = { x: 478, y: 368 };   // 五通（曲柄轴）
  const CRANK_R = 26;                // 曲柄长度
  const HIP  = { x: 398, y: 244 };   // 髋关节（身体下缘）
  const THIGH = 92, SHIN = 96;       // 大腿 / 小腿长度

  /* ---------- 车轮辐条 + 气门嘴（旋转参照物） ---------- */
  function spokes(g, cx, cy, r, n){
    for (let i = 0; i < n; i++){
      const a = i * 2 * Math.PI / n;
      g.appendChild(svgEl("line", {
        x1: cx + Math.cos(a) * 11, y1: cy + Math.sin(a) * 11,
        x2: cx + Math.cos(a) * r,  y2: cy + Math.sin(a) * r,
        stroke: i === 0 ? "#39424e" : "#b3bfcb",
        "stroke-width": i === 0 ? 4.5 : 2.2,
        "stroke-linecap": "round"
      }));
    }
    g.appendChild(svgEl("circle", { cx, cy: cy - r + 7, r: 4.5, fill: "#39424e" }));
  }
  spokes($("rearSpokes"),  280, 355, 66, 12);
  spokes($("frontSpokes"), 660, 355, 66, 12);

  /* ---------- 云 ---------- */
  const cloudDefs = [[90,104,1],[380,62,.82],[690,138,1.12],[980,84,.9],[1250,52,1.0],[1520,124,.88]];
  const clouds = cloudDefs.map(([x,y,s]) => {
    const g = svgEl("g", {});
    const puffs = [[0,0,30],[-34,10,22],[32,12,24],[-12,-14,20],[16,-16,18]];
    puffs.forEach(([dx,dy,r]) => g.appendChild(svgEl("circle", {
      cx: dx*s, cy: dy*s, r: r*s, fill: "#ffffff", opacity: .82
    })));
    $("clouds").appendChild(g);
    return { g, x, y, s };
  });
  const CLOUD_SPAN = 1700;

  /* ---------- 远山 / 近山（周期函数保证无缝平铺） ---------- */
  function ridge(period, x0, x1, baseY, a1, a2, phase){
    let d = `M ${x0} 470 L ${x0} ${baseY.toFixed(1)}`;
    for (let x = x0; x <= x1; x += 5){
      const y = baseY
        - a1 * (0.5 + 0.5 * Math.sin(2 * Math.PI * x / period + phase))
        - a2 * (0.5 + 0.5 * Math.sin(2 * Math.PI * x / (period / 2) + phase * 1.6));
      d += ` L ${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    return d + ` L ${x1} 470 Z`;
  }
  const FAR_P = 460, NEAR_P = 300;
  $("hillsFar").appendChild(svgEl("path",  { d: ridge(FAR_P,  -FAR_P, 940 + FAR_P, 402, 62, 22, 0.4),  fill: "#a9cfb8" }));
  $("hillsNear").appendChild(svgEl("path", { d: ridge(NEAR_P, -NEAR_P, 940 + NEAR_P, 428, 44, 16, 1.9), fill: "#83bd97" }));
  $("hillsNear").appendChild(svgEl("path", { d: ridge(NEAR_P, -NEAR_P, 940 + NEAR_P, 428, 44, 16, 3.4), fill: "#6fae88", opacity: .55 }));

  /* ---------- 路边景物（灌木 / 石头） ---------- */
  const SCENERY_SPAN = 1200;
  const sceneryItems = [];
  for (let i = 0; i < 6; i++){
    const x = i * 200 + 60;
    const seed = (i * 37) % 7;
    const g = svgEl("g", {});
    if (seed % 2 === 0){
      [[-16,0,17],[0,-9,22],[17,1,16]].forEach(([dx,dy,r]) =>
        g.appendChild(svgEl("circle", { cx: x + dx, cy: 424 + dy, r, fill: "#5c9c73" })));
      g.appendChild(svgEl("circle", { cx: x - 6, cy: 416 + (seed % 3), r: 7, fill: "#79b98d" }));
    } else {
      g.appendChild(svgEl("path", {
        d: `M ${x-26},432 L ${x-16},406 L ${x+2},398 L ${x+22},412 L ${x+26},432 Z`,
        fill: "#9aa5b1"
      }));
      g.appendChild(svgEl("path", { d: `M ${x-16},406 L ${x+2},398 L ${x+10},416 Z`, fill: "#b7c1cb" }));
    }
    $("scenery").appendChild(g);
    sceneryItems.push({ g, x });
  }

  /* ---------- 背景飞鸟 ---------- */
  [[420,72,1,0],[420,128,.72,-3.4],[420,48,.86,-7.8]].forEach(([x,y,s,delay]) => {
    const g = svgEl("g", { class: "farbird", style: `animation-delay:${delay}s` });
    g.appendChild(svgEl("path", {
      d: `M ${x},${y} q ${11*s},${-8*s} ${22*s},0 q ${11*s},${-8*s} ${22*s},0`,
      fill: "none", stroke: "#5d7f96", "stroke-width": 3*s, "stroke-linecap": "round", opacity: .5
    }));
    $("birds").appendChild(g);
  });

  /* ---------- 双骨 IK ---------- */
  function solve(hip, foot, l1, l2){
    const dx = foot.x - hip.x, dy = foot.y - hip.y;
    const d = Math.max(Math.abs(l1 - l2) + 1, Math.min(l1 + l2 - 1, Math.hypot(dx, dy)));
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const bx = dx / d, by = dy / d;
    const px = hip.x + a * bx, py = hip.y + a * by;
    const k1 = { x: px - h * by, y: py + h * bx };
    const k2 = { x: px + h * by, y: py - h * bx };
    return (k1.x > k2.x) ? k1 : k2;   // 膝盖朝前弯
  }
  const legD = (foot, hip) => {
    const k = solve(hip, foot, THIGH, SHIN);
    return `M ${hip.x} ${hip.y} L ${k.x.toFixed(1)} ${k.y.toFixed(1)} L ${foot.x.toFixed(1)} ${foot.y.toFixed(1)}`;
  };
  const moveG = (g, x, y) => g.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)})`);

  const nearCrank = $("nearCrank"), farCrank = $("farCrank");
  const nearLeg = $("nearLeg"), farLeg = $("farLeg");
  const nearPedalG = $("nearPedalG"), farPedalG = $("farPedalG");
  const nearFootG = $("nearFootG"), farFootG = $("farFootG");

  function updateRig(theta){
    const c = Math.cos(theta), s = Math.sin(theta);
    const near = { x: BB.x + c * CRANK_R, y: BB.y + s * CRANK_R };
    const far  = { x: BB.x - c * CRANK_R, y: BB.y - s * CRANK_R };

    nearCrank.setAttribute("x2", near.x.toFixed(2));
    nearCrank.setAttribute("y2", near.y.toFixed(2));
    farCrank.setAttribute("x2", far.x.toFixed(2));
    farCrank.setAttribute("y2", far.y.toFixed(2));

    moveG(nearPedalG, near.x, near.y);
    moveG(farPedalG, far.x, far.y);
    moveG(nearFootG, near.x, near.y);
    moveG(farFootG, far.x, far.y);

    nearLeg.setAttribute("d", legD(near, HIP));
    farLeg.setAttribute("d", legD(far, HIP));
  }

  /* ---------- 视差滚动 ---------- */
  const roadDashes = $("roadDashes");
  const DASH_PERIOD = 124;
  function updateScroll(dist){
    clouds.forEach(c => {
      const x = ((c.x - dist * 0.10) % CLOUD_SPAN + CLOUD_SPAN) % CLOUD_SPAN - 260;
      c.g.setAttribute("transform", `translate(${x.toFixed(1)} ${c.y})`);
    });
    $("hillsFar").setAttribute("transform",  `translate(${(-(dist * 0.16) % FAR_P).toFixed(2)} 0)`);
    $("hillsNear").setAttribute("transform", `translate(${(-(dist * 0.40) % NEAR_P).toFixed(2)} 0)`);
    sceneryItems.forEach(it => {
      const x = ((it.x - dist) % SCENERY_SPAN + SCENERY_SPAN) % SCENERY_SPAN - 160;
      it.g.setAttribute("transform", `translate(${(x - it.x).toFixed(2)} 0)`);
    });
    roadDashes.setAttribute("stroke-dashoffset", (dist % DASH_PERIOD).toFixed(2));
  }

  /* ---------- 主循环 ---------- */
  let last = 0, dist = 0, theta = 0;
  function loop(now){
    if (!last) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    dist += SPEED * dt;
    theta += CRANK_W * dt;
    updateScroll(dist);
    updateRig(theta);
    requestAnimationFrame(loop);
  }
  updateScroll(0);
  updateRig(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
