<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑车 · Pelican Pedal</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1622}
  body{display:block}
  svg{display:block;width:100vw;height:100vh}

  /* ---- 视差滚动层：--p 为循环周期(px)，--d 为一个周期时长 ---- */
  .scroll{
    animation:scrollX var(--d,20s) linear infinite;
  }
  @keyframes scrollX{
    from{transform:translateX(0)}
    to{transform:translateX(calc(var(--p) * -1))}
  }

  /* ---- 链条 ---- */
  .chain-run{
    stroke-dasharray:9 15;
    animation:chainMove .8s linear infinite;
  }
  @keyframes chainMove{from{stroke-dashoffset:0}to{stroke-dashoffset:24}}

  /* ---- 路面虚线 ---- */
  .road-dash{
    stroke-dasharray:62 42;
    animation:roadMove .253s linear infinite;
  }
  @keyframes roadMove{from{stroke-dashoffset:0}to{stroke-dashoffset:-104}}

  /* ---- 车后扬尘 ---- */
  .dust{animation:dust 1.15s linear infinite}
  @keyframes dust{
    0%{transform:translate(0,0) scale(.35);opacity:0}
    18%{opacity:.45}
    100%{transform:translate(-96px,-16px) scale(1.7);opacity:0}
  }
  .d2{animation-delay:-.38s}
  .d3{animation-delay:-.76s}

  /* ---- 汗珠 ---- */
  .sweat{animation:sweat 2.1s linear infinite}
  @keyframes sweat{
    0%{transform:translate(0,0) scale(.4);opacity:0}
    25%{opacity:.9}
    100%{transform:translate(-46px,26px) scale(1.1);opacity:0}
  }
  .s2{animation-delay:-1.05s}
</style>
</head>
<body>

<svg viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid slice" role="img" aria-label="鹈鹕骑自行车的二维动画">
  <title>鹈鹕骑车 Pelican Pedal</title>
  <defs>

    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">

      <stop offset="1"   stop-color="#e97a22"/>

    <!-- 辐条 -->

      <line x1="0" y1="-11" x2="0" y2="-71" transform="rotate(90)"/>

    <g class="sweat s2"><path d="M0 -5 C3.4 0 4.2 2.6 4.2 4.3 A4.2 4.2 0 0 1 -4.2 4.3 C-4.2 2.6 -3.4 0 0 -5 Z" fill="#d8f0ff" stroke="#5aa8d0" stroke-width="1.1"/></g>

<script>
(function(){
  var CR = {x:510, y:357}, R = 34;      // 曲柄中心 / 曲柄半径
  var L1 = 95, L2 = 95;                    // 大腿 / 小腿长度
  var HIP_N = {x:500, y:205}, HIP_F = {x:478, y:200};
  var REV = 1.2;                           // 曲柄一圈秒数（与车轮同步）

  function $(id){ return document.getElementById(id); }

  var rider=$('rider'), ring=$('chainring'),
      armN=$('armNear'), armF=$('armFar'),
      pedN=$('pedalNear'), pedF=$('pedalFar'),
      legN=$('legNear'), legNi=$('legNearIn'), legF=$('legFar'),
      footN=$('footNear'), footF=$('footFar'),
      spinR=$('spinR'), spinF=$('spinF'),
      head=$('head'), pouch=$('pouch'), eye=$('eye'),
      tail=$('tail'), wingN=$('wingNear'), wingF=$('wingFar');

  legF.setAttribute('stroke', '#c07a2e');
  legF.setAttribute('stroke-width', '9');
  legF.setAttribute('opacity', '.92');

  // 两骨逆运动学：求膝盖位置（膝盖朝前）
  function solveKnee(hx, hy, fx, fy){
    var dx=fx-hx, dy=fy-hy;
    var d=Math.sqrt(dx*dx+dy*dy) || 1;
    d=Math.max(Math.abs(L1-L2)+0.5, Math.min(L1+L2-0.5, d));
    var a=(L1*L1 - L2*L2 + d*d)/(2*d);
    var h=Math.sqrt(Math.max(0, L1*L1 - a*a));
    var ux=dx/d, uy=dy/d;
    return [hx + a*ux + h*uy, hy + a*uy - h*ux];
  }

  function setLeg(poly, hip, foot){
    var k = solveKnee(hip.x, hip.y, foot.x, foot.y);
    poly.setAttribute('points', hip.x+','+hip.y+' '+k[0].toFixed(2)+','+k[1].toFixed(2)+' '+foot.x.toFixed(2)+','+foot.y.toFixed(2));
    return k;
  }

  function frame(now){
    var th = (now/1000) / REV * Math.PI * 2;   // 曲柄角
    var deg = th * 180 / Math.PI;
    var c = Math.cos(th), s = Math.sin(th);

    // 两只脚踏位置（相位差 180°）
    var pN = {x: CR.x + R*c, y: CR.y + R*s};
    var pF = {x: CR.x - R*c, y: CR.y - R*s};

    setLeg(legNi, HIP_N, pN);
    setLeg(legN,  HIP_N, pN);
    setLeg(legF,  HIP_F, pF);

    footN.setAttribute('transform', 'translate('+pN.x.toFixed(2)+','+pN.y.toFixed(2)+')');
    footF.setAttribute('transform', 'translate('+pF.x.toFixed(2)+','+pF.y.toFixed(2)+')');
    pedN.setAttribute('transform', 'translate('+pN.x.toFixed(2)+','+pN.y.toFixed(2)+')');
    pedF.setAttribute('transform', 'translate('+pF.x.toFixed(2)+','+pF.y.toFixed(2)+')');

    armN.setAttribute('x2', pN.x.toFixed(2)); armN.setAttribute('y2', pN.y.toFixed(2));
    armF.setAttribute('x2', pF.x.toFixed(2)); armF.setAttribute('y2', pF.y.toFixed(2));

    ring.setAttribute('transform', 'translate('+CR.x+','+CR.y+') rotate('+deg.toFixed(2)+')');
    spinR.setAttribute('transform', 'rotate('+deg.toFixed(2)+')');
    spinF.setAttribute('transform', 'rotate('+deg.toFixed(2)+')');

    // 车身颠簸：每转两次起伏
    var bob  = Math.sin(2*th) * 2.8;
    var tilt = Math.sin(2*th) * 0.95;
    rider.setAttribute('transform',
      'translate(0,'+bob.toFixed(2)+') rotate('+tilt.toFixed(2)+',500,436)');

    // 头部 / 喉囊 / 眼睛 / 尾羽 / 双翼 的二阶运动
    var h = Math.sin(2*th - 0.9);
    head.setAttribute('transform', 'rotate('+(h*3.4).toFixed(2)+',584,74)');
    pouch.setAttribute('transform', 'rotate('+(Math.sin(2*th+1.5)*2.6).toFixed(2)+',600,48)');

    var blink = 1;
    var p = (now/1000) % 3.8;
    if (p < 0.16) blink = 1 - Math.abs(p - 0.08)/0.08;
    eye.setAttribute('transform',
      'translate(590,40) scale(1,'+blink.toFixed(3)+') translate(-590,-40)');

    tail.setAttribute('transform', 'rotate('+(Math.sin(2*th+1.4)*2.4).toFixed(2)+',392,152)');

    var w = Math.sin(2*th + 0.6);
    wingN.setAttribute('transform', 'rotate('+(w*1.7).toFixed(2)+',520,120)');
    wingF.setAttribute('transform', 'rotate('+(-w*1.5).toFixed(2)+',500,130)');

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
