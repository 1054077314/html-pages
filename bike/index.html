<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican Ride</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background:#0f172a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:24px; color:#e2e8f0;
  }
  h1 { font-size:22px; letter-spacing:.15em; font-weight:700; margin-bottom:6px; }
  h1 span { color:#fbbf24; }
  p.sub { opacity:.55; font-size:13px; letter-spacing:.2em; margin-bottom:16px; }
  .stage {
    width:min(920px,96vw);
    border-radius:18px; overflow:hidden;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 0 0 6px rgba(255,255,255,.03);
  }
  svg { display:block; width:100%; height:auto; background:#7dd3fc; }
  .panel {
    width:min(920px,96vw);
    margin-top:12px; display:flex; gap:10px; align-items:center; justify-content:center;
    font-size:13px; opacity:.9;
  }
  .panel button {
    background:#fbbf24; border:none; border-radius:999px;
    padding:8px 18px; font-weight:700; cursor:pointer; font-size:13px; color:#1e1b04;
  }
  .panel button.ghost { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); }
  .panel input[type=range]{ accent-color:#fbbf24; width:180px; }

  /* ===== 2D 动画关键帧 ===== */
  @keyframes wheelSpin { to { transform:rotate(360deg); } }
  @keyframes bob { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-7px);} }
  @keyframes bob2 { 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-4px) rotate(-1.5deg);} }
  @keyframes headBob { 0%,100%{ transform:translateY(0) rotate(0deg);} 50%{ transform:translateY(-5px) rotate(2deg);} }
  @keyframes pouchWobble { 0%,100%{ transform:scaleY(1);} 50%{ transform:scaleY(1.08) skewX(2deg);} }
  @keyframes tailWag { 0%,100%{ transform:rotate(-4deg);} 50%{ transform:rotate(6deg);} }
  @keyframes cloudDrift { from{ transform:translateX(0);} to{ transform:translateX(-900px);} }
  @keyframes cloudDrift2 { from{ transform:translateX(120px);} to{ transform:translateX(-800px);} }
  @keyframes dashMove { to { stroke-dashoffset:-80; } }
  @keyframes blink { 0%,92%,100%{ transform:scaleY(1);} 95%{ transform:scaleY(.08);} }
  @keyframes dust { 0%{ opacity:.8; transform:translate(0,0) scale(.6);} 100%{ opacity:0; transform:translate(-70px,-28px) scale(1.6);} }
  @keyframes wingGrip { 0%,100%{ transform:rotate(0deg);} 50%{ transform:rotate(-3deg);} }
  @keyframes chainMove { to { stroke-dashoffset:-20; } }

  .wheel-spin { transform-box:fill-box; transform-origin:center; animation:wheelSpin .9s linear infinite; }
  .bob { animation:bob .9s ease-in-out infinite; }
  .bob2 { animation:bob2 .9s ease-in-out infinite; }
  .head-group { transform-box:fill-box; transform-origin:20% 80%; animation:headBob .9s ease-in-out infinite; }
  .pouch { transform-box:fill-box; transform-origin:top center; animation:pouchWobble .9s ease-in-out infinite; }
  .tail { transform-box:fill-box; transform-origin:right center; animation:tailWag .9s ease-in-out infinite; }
  .eye-lid { transform-box:fill-box; transform-origin:center; animation:blink 4s ease-in-out infinite; }
  .road-dash { animation:dashMove .6s linear infinite; }
  .cloud-a { animation:cloudDrift 28s linear infinite; }
  .cloud-b { animation:cloudDrift2 38s linear infinite; }
  .cloud-c { animation:cloudDrift 48s linear infinite; }
  .dust-puff { animation:dust 1.1s ease-out infinite; }
  .chain-links { animation:chainMove .4s linear infinite; }
  .dust-puff.d2 { animation-delay:.35s; }
  .dust-puff.d3 { animation-delay:.7s; }
  .wing-arm { transform-box:fill-box; transform-origin:left center; animation:wingGrip .9s ease-in-out infinite; }
</style>
</head>
<body>

<div class="panel">
  <button id="btnPause">⏸ 暂停</button>
  <button id="btnSlow" class="ghost">慢速</button>
  <button id="btnFast" class="ghost">加速 🚀</button>
  <label>速度 <input id="speed" type="range" min="1" max="10" value="5"></label>
</div>

<script>
(() => {
  const BB = {x:400, y:320}, R = 28;
  const hipR = {x:350, y:215}, hipF = {x:378, y:215};
  const arm1 = document.getElementById('arm1');
  const arm2 = document.getElementById('arm2');
  const pedal1 = document.getElementById('pedal1');
  const pedal2 = document.getElementById('pedal2');
  const legR = document.getElementById('legRear');
  const legF = document.getElementById('legFront');
  const footR = document.getElementById('footRear');
  const footF = document.getElementById('footFront');
  const spokesR = document.getElementById('spokesR');
  const spokesF = document.getElementById('spokesF');

  let angle = 0, speedFactor = 1, running = true, wheelAngle = 0;
  const speedInput = document.getElementById('speed');

  function frame(dt){
    if(running){
      angle += dt * 0.006 * speedFactor;
      wheelAngle -= dt * 0.015 * speedFactor;
    }
    const a1 = angle, a2 = angle + Math.PI;
    const f1 = { x: BB.x + R*Math.cos(a1), y: BB.y + R*Math.sin(a1) };
    const f2 = { x: BB.x + R*Math.cos(a2), y: BB.y + R*Math.sin(a2) };

    arm1.setAttribute('x2', f1.x); arm1.setAttribute('y2', f1.y);
    arm2.setAttribute('x2', f2.x); arm2.setAttribute('y2', f2.y);
    pedal1.setAttribute('transform', `translate(${f1.x} ${f1.y})`);
    pedal2.setAttribute('transform', `translate(${f2.x} ${f2.y})`);

    // 腿: 髋固定 -> 脚
    legR.setAttribute('x2', f1.x); legR.setAttribute('y2', f1.y - 4);
    legF.setAttribute('x2', f2.x); legF.setAttribute('y2', f2.y - 4);
    footR.setAttribute('cx', f1.x + 6); footR.setAttribute('cy', f1.y - 6);
    footF.setAttribute('cx', f2.x + 6); footF.setAttribute('cy', f2.y - 6);

    // 身体轻微起伏叠加 (和CSS bob配合, 这里给腿的髋点呼吸感可省略)
    spokesR.style.transform = `rotate(${wheelAngle}deg)`;
    spokesF.style.transform = `rotate(${wheelAngle}deg)`;

    // 速度感: 路面虚线 / 云 / 尘土快慢联动
    const w = 0.9 / Math.max(speedFactor, 0.2);
    document.querySelectorAll('.wheel-spin').forEach(e => { if(!e.style.animationDuration || e.closest('#chainG')===null) e.style.animationDuration = w + 's'; });
    document.querySelector('.road-dash').style.animationDuration = (0.6 / speedFactor) + 's';
    document.querySelectorAll('.chain-links').forEach(e => e.style.animationDuration = (0.4 / speedFactor) + 's');
  }
  let last = performance.now();
  function loop(t){
    frame(t - last); last = t;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.getElementById('btnPause').onclick = (e) => {
    running = !running;
    e.target.textContent = running ? '⏸ 暂停' : '▶ 继续';
    document.querySelectorAll('#scene *').forEach(el => {
      if(el.style) el.style.animationPlayState = running ? 'running' : 'paused';
    });
    document.styleSheets[0].cssRules; // noop
    // 暂停所有CSS动画
    document.getElementById('scene').style.animationPlayState = running ? 'running' : 'paused';
    document.querySelectorAll('.bob,.bob2,.head-group,.pouch,.tail,.eye-lid,.road-dash,.cloud-a,.cloud-b,.cloud-c,.dust-puff,.wheel-spin,.wing-arm,.chain-links').forEach(el=>{
      el.style.animationPlayState = running ? 'running' : 'paused';
    });
  };
  document.getElementById('btnSlow').onclick = () => { speedFactor = 0.5; speedInput.value = 2; };
  document.getElementById('btnFast').onclick = () => { speedFactor = 2.2; speedInput.value = 9; };
  speedInput.oninput = (e) => { speedFactor = e.target.value / 5; };
})();
</script>
</body>
</html>
